name: clara
description: Reconnaître et collectionner les œuvres des musées, 100 % hors ligne.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.11.0 <1.0.0'
  image: '>=4.2.0 <5.0.0'
  onnxruntime_v2: ^1.23.2
  path_provider: ^2.1.4
  sqlite3: '>=2.4.6 <3.0.0'
  sqlite3_flutter_libs: '>=0.5.24 <0.6.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
  # Remplis par tool/prepare_assets.sh (modèle DINOv2 + pack du musée), voir README.
  assets:
    - assets/model/
    - assets/packs/dk-smk/
    - assets/packs/dk-smk/thumbs/
