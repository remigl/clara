name: Android

on:
  push:
    branches: [main]
  # Publier une release sur GitHub construit l'APK et le joint à la release.
  release:
    types: [published]
  # Lancement manuel (onglet Actions > Android > Run workflow) : avec un tag, joint l'APK à cette release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag d'une release existante à laquelle joindre l'APK (ex. v0.1.0), vide = simple build"
        required: false
        default: ''

concurrency:
  group: apk-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache des données SMK (notices et images)
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: smk-data-${{ github.run_id }}
          restore-keys: smk-data-

      - name: Modèle DINOv2 et pack SMK
        working-directory: pipeline
        run: |
          set -o pipefail
          pip install -q -r requirements.txt
          python -m clara_p0 download-model --variant dinov2-small 2>&1 | tee -a ../ci.log
          OPTS="--model models/dinov2-small.onnx --projection none --pooling cls"
          # l'API SMK est parfois instable : en dernier recours, notices de la compilation précédente (cache)
          if ! python -m clara_p0 build-smk $OPTS 2>&1 | tee -a ../ci.log; then
            test -f cache/smk/raw.jsonl || exit 1
            echo "API SMK indisponible : notices en cache réutilisées" | tee -a ../ci.log
            python -m clara_p0 build-smk $OPTS --offline-raw 2>&1 | tee -a ../ci.log
          fi

      - name: Assets de l'app
        run: |
          set -o pipefail
          bash app/tool/prepare_assets.sh pipeline/packs/dk-smk-v1 pipeline/models/dinov2-small.onnx 2>&1 | tee -a ci.log

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Projet Android
        working-directory: app
        run: |
          set -o pipefail
          flutter --version 2>&1 | tee -a ../ci.log
          bash tool/configure_android.sh 2>&1 | tee -a ../ci.log

      - name: Dépendances et analyse
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a ../ci.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ../ci.log

      - name: Build APK
        working-directory: app
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          set -o pipefail
          # les dépôts Gradle/Maven ont des pannes passagères (POM illisible, 5xx) : jusqu'à 3 essais
          for attempt in 1 2 3; do
            if flutter build apk --release --target-platform android-arm64 2>&1 | tee -a ../ci.log; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Échec de la compilation (essai $attempt), nouvel essai dans 30 s" | tee -a ../ci.log
            sleep 30
          done
          cp build/app/outputs/flutter-apk/app-release.apk "../clara-${TAG}.apk"
          ls -lh ../clara-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clara-apk
          path: clara-*.apk

      - name: Joindre l'APK à la release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: clara-*.apk
          body_path: app/RELEASE_NOTES.md

      - name: Journal en annotations
        if: failure()
        run: python3 .github/scripts/annotate_log.py ci.log
