name: Packs musées

# Construit un pack par musée de pipeline/museums.json (en parallèle), assemble catalog.json et,
# pour une release, met catalog.json et les packs en ligne : l'app les télécharge depuis
# https://github.com/remigl/clara/releases/latest/download/catalog.json
on:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/packs.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag d'une release existante où publier les packs (ex. v0.2.0), vide = simple construction"
        required: false
        default: ''
      rebuild:
        description: "Reconstruire quand même : all, ou id1,id2 (vide = seulement les musées nouveaux ou modifiés)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: packs-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
      reuse: ${{ steps.plan.outputs.reuse }}
      prev_tag: ${{ steps.plan.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # push sur main : packs d'essai seulement si le message contient [packs] ou [packs:id1,id2]
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          ids = [m["id"] for m in json.load(open("pipeline/museums.json"))["museums"]]
          tags = re.findall(r"\[packs(?::([^\]]+))?\]", os.environ.get("MSG", ""))
          if "" not in tags:  # [packs] seul = tous ; sinon union des [packs:a,b]
              wanted = {i.strip() for t in tags for i in t.split(",")}
              ids = [i for i in ids if i in wanted]
          print("ids=" + json.dumps(ids))
          print("reuse=[]")
          print("prev_tag=")
          PY
          else
            # release : ne reconstruire que les musées nouveaux ou modifiés, reprendre les autres
            PREV=$(bash .github/scripts/prev_catalog.sh "$TAG" prev)
            echo "Release précédente avec catalogue : ${PREV:-aucune}"
            cd pipeline
            PLAN=$(python3 -m clara_p0 plan --registry museums.json --previous ../prev/catalog.json --force "$REBUILD")
            echo "ids=$(echo "$PLAN" | python3 -c 'import json,sys;print(json.dumps(json.load(sys.stdin)["build"]))')" >> "$GITHUB_OUTPUT"
            echo "reuse=$(echo "$PLAN" | python3 -c 'import json,sys;print(json.dumps(json.load(sys.stdin)["reuse"]))')" >> "$GITHUB_OUTPUT"
            echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          fi

  pack:
    needs: list
    if: needs.list.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        id: ${{ fromJSON(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache (métadonnées, images, résumés Wikipédia)
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pack-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: pack-${{ matrix.id }}-
      - name: Pack ${{ matrix.id }}
        working-directory: pipeline
        run: |
          set -o pipefail
          pip install -q -r requirements.txt
          python -m clara_p0 download-model --variant dinov2-small 2>&1 | tee -a ../ci.log
          python -m clara_p0 build-catalog --only "${{ matrix.id }}" --model models/dinov2-small.onnx \
            --projection none --pooling cls 2>&1 | tee -a ../ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.id }}
          path: |
            pipeline/packs/*.zip
            pipeline/packs/*/manifest.json
      - name: Journal en annotations
        if: failure()
        run: python3 .github/scripts/annotate_log.py ci.log

  catalog:
    needs: [list, pack]
    if: always() && (needs.list.outputs.ids != '[]' || needs.list.outputs.reuse != '[]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pack-*
          path: pipeline/packs
      - name: Packs repris de la release précédente (inchangés)
        if: needs.list.outputs.reuse != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ needs.list.outputs.reuse }}
          PREV: ${{ needs.list.outputs.prev_tag }}
        run: |
          echo "$REUSE" | python3 -c "import json,sys;[print(r['id'],r['file']) for r in json.load(sys.stdin)]" |
          while read -r id file; do
            d="pipeline/packs/reuse-$id"; stem="${file%.zip}"
            mkdir -p "$d/$stem"
            gh release download "$PREV" -R "$GITHUB_REPOSITORY" -p "$file" -D "$d" --clobber
            unzip -o -q "$d/$file" manifest.json -d "$d/$stem"
            echo "repris : $id ($file, $PREV)"
          done
      - name: catalog.json
        working-directory: pipeline
        run: |
          python3 -m clara_p0 merge-catalog --packs packs --registry museums.json
          cat packs/catalog.json
          ls -lh packs/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            pipeline/packs/catalog.json
            pipeline/packs/*.zip
      - name: Publier dans la release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: |
            pipeline/packs/catalog.json
            pipeline/packs/*.zip
